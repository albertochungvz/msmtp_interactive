name: Verify Installer and Modules Coherence

on:
  push:
    paths:
      - 'install_msmtp_armored.sh'
      - 'modules/**'
      - 'verify_installer.sh'
  pull_request:
    paths:
      - 'install_msmtp_armored.sh'
      - 'modules/**'
      - 'verify_installer.sh'

jobs:
  sanity-check:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v3

      - name: Make script executable
        run: chmod +x verify_installer.sh

      - name: Run coherence verification
        run: ./verify_installer.sh
